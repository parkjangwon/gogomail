<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — GoGoMail</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #f7f7f5;
      color: #1a1a1a;
      padding: max(24px, env(safe-area-inset-top)) 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #191919; color: #e8e8e5; }
      .card { background: #1f1f1f; border-color: #2e2e2b; }
      .sub { color: #8b8b88; }
    }
    .card {
      background: #fff;
      border: 1px solid #e8e8e5;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .08);
    }
    .mark {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: #2f6ee0;
      display: grid; place-items: center;
      margin: 0 auto 20px;
    }
    .mark svg { width: 36px; height: 36px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .sub { color: #6b6b6b; font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
    button {
      appearance: none; border: none; cursor: pointer;
      background: #2f6ee0; color: #fff;
      font-size: 15px; font-weight: 600;
      border-radius: 10px; padding: 12px 20px;
      min-height: 44px; width: 100%;
    }
    button:hover { background: #2560c8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p class="sub">GoGoMail can't reach the network right now. Recently viewed mail is still available — reconnect to load new messages.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Auto-retry when connectivity returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
