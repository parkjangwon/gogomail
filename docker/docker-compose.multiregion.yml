# GoGoMail multi-region failover practice stack.
#
# Purpose: give operators a local, disposable environment to practice the
# active-passive failover procedure documented in docs/MULTI_REGION.md. It
# spins up:
#
#   postgres-primary   — the writable primary (region A)
#   postgres-replica   — a streaming (physical) read replica (region B)
#   redis              — shared cache/streams (single node for the drill)
#   backend            — GoGoMail all-in-one, reads routed to the replica
#
# This is a PRACTICE topology, not a production one. In production the two
# Postgres instances live in different regions/availability zones behind their
# own storage and networking. Here they are two containers so you can pull the
# plug on the primary and rehearse promotion.
#
# Concrete versions (pin these in production too):
#   - postgres:16.4-alpine   (streaming replication, pg_basebackup)
#   - redis:7.4-alpine
#
# Usage:
#   docker compose -f docker/docker-compose.multiregion.yml up -d
#   # wait for the replica to come up (it runs pg_basebackup on first boot)
#   docker compose -f docker/docker-compose.multiregion.yml logs -f postgres-replica
#
#   # Inspect replication:
#   docker compose -f docker/docker-compose.multiregion.yml exec postgres-primary \
#     psql -U gogomail -d gogomail -c "SELECT client_addr, state, sync_state FROM pg_stat_replication;"
#
#   # Practice failover: stop the primary, promote the replica.
#   docker compose -f docker/docker-compose.multiregion.yml stop postgres-primary
#   docker compose -f docker/docker-compose.multiregion.yml exec postgres-replica \
#     su - postgres -c "pg_ctl promote -D /var/lib/postgresql/data"
#
# See docs/MULTI_REGION.md for the full runbook and checklist.

x-common-pg-env: &common-pg-env
  POSTGRES_DB: ${POSTGRES_DB:-gogomail}
  POSTGRES_USER: ${POSTGRES_USER:-gogomail}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gogomail}
  # Replication role credentials (created on the primary, used by the replica).
  REPLICATION_USER: ${REPLICATION_USER:-replicator}
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}

services:
  postgres-primary:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      <<: *common-pg-env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - synchronous_commit=on
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./multiregion/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gogomail-mr

  postgres-replica:
    image: postgres:16.4-alpine
    restart: unless-stopped
    user: postgres
    environment:
      <<: *common-pg-env
      PRIMARY_HOST: postgres-primary
      PRIMARY_PORT: "5432"
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./multiregion/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "15433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - gogomail-mr

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gogomail-mr

  # Runs migrations against the primary, then serves all-in-one with reads
  # routed to the replica. Fallback to primary is enabled so the app keeps
  # serving reads if the replica is promoted, lagging, or unreachable.
  backend:
    image: ${BACKEND_IMAGE:-gogomail:dev}
    restart: unless-stopped
    command: ["-migrate", "-mode", "all-in-one"]
    environment:
      GOGOMAIL_ENV: development
      GOGOMAIL_HTTP_ADDR: :8080
      GOGOMAIL_DATABASE_URL: postgres://gogomail:gogomail@postgres-primary:5432/gogomail?sslmode=disable
      GOGOMAIL_DATABASE_REPLICA_URL: postgres://gogomail:gogomail@postgres-replica:5432/gogomail?sslmode=disable
      GOGOMAIL_DB_REPLICA_MAX_STALENESS: 10s
      GOGOMAIL_DB_REPLICA_FALLBACK_TO_PRIMARY: "true"
      GOGOMAIL_REDIS_ADDR: redis:6379
      GOGOMAIL_STORAGE_BACKEND: local
      GOGOMAIL_MAILSTORE_ROOT: /data/mailstore
      GOGOMAIL_AUTH_JWT_SECRET: ${GOGOMAIL_AUTH_JWT_SECRET:-dev-insecure-jwt-secret-change-me-please-32b}
      GOGOMAIL_ADMIN_TOKEN: ${GOGOMAIL_ADMIN_TOKEN:-dev-admin-token}
      GOGOMAIL_DM_MASTER_KEY: ${GOGOMAIL_DM_MASTER_KEY:-dev-insecure-dm-master-key-change-me-32byte}
      GOGOMAIL_METRICS_BACKEND: prometheus
      GOGOMAIL_METRICS_ADDR: :9090
      GOGOMAIL_SMTP_DOMAIN: ${GOGOMAIL_SMTP_DOMAIN:-example.test}
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - backend-data:/data
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gogomail-mr

volumes:
  primary-data:
  replica-data:
  redis-data:
  backend-data:

networks:
  gogomail-mr:
    driver: bridge
